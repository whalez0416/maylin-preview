name: uptime maylinseoul.com

# 10분마다 www·api 를 찍는다. 3번 연속 실패면 job 이 실패 → GitHub 가 레포 주인에게 이메일(기본 설정: 실패한 워크플로만 알림)
# + 슬랙(개인 채널, 시크릿 SLACK_WEBHOOK_MAYLIN). 감시자는 우리 서버 밖(GitHub 러너)에 있어야 서버가 죽어도 알림이 간다.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: www + api
        id: probe
        run: |
          check() {  # url, 기대 문자열
            for i in 1 2 3; do
              body=$(curl -sS --max-time 20 -w '\n%{http_code}' "$1" 2>/dev/null) && code=$(echo "$body" | tail -1) || code=000
              if [ "$code" = "200" ] && echo "$body" | grep -q "$2"; then echo "OK  $1"; return 0; fi
              echo "retry $i: $1 -> $code"; sleep 20
            done
            echo "DOWN $1 (last $code)"; echo "down=$1 ($code)" >> "$GITHUB_OUTPUT"; return 1
          }
          fail=0
          check "https://www.maylinseoul.com/" "MAYLIN" || fail=1
          check "https://api.maylinseoul.com/api/health" "code" || fail=1
          exit $fail
      - name: 슬랙 경보
        if: failure()
        env:
          HOOK: ${{ secrets.SLACK_WEBHOOK_MAYLIN }}
        run: |
          [ -z "$HOOK" ] && exit 0
          curl -s -X POST -H 'Content-Type: application/json; charset=utf-8' "$HOOK" --data @- <<'JSON'
          {"text": "메이린 사이트 응답 없음: ${{ steps.probe.outputs.down }}",
           "blocks": [
             {"type": "header", "text": {"type": "plain_text", "text": "🚨 메이린 사이트 응답 없음", "emoji": true}},
             {"type": "section", "text": {"type": "mrkdwn", "text": "*${{ steps.probe.outputs.down }}*\n약 1분간 3회 재시도 모두 실패"}},
             {"type": "context", "elements": [{"type": "mrkdwn", "text": "<https://www.maylinseoul.com/|사이트 열어보기> · Coolify 콘솔에서 web/api 컨테이너 확인 · 10분 뒤 자동 재검사"}]}
           ]}
          JSON

name: uptime maylinseoul.com

# 10분마다 www·api 를 찍는다. 3번 연속 실패면 job 이 실패 → GitHub 가 레포 주인에게 이메일(기본 설정: 실패한 워크플로만 알림).
# 감시자는 우리 서버 밖(GitHub 러너)에 있어야 서버가 죽어도 알림이 간다.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: www + api
        run: |
          check() {  # url, 기대 문자열
            for i in 1 2 3; do
              body=$(curl -sS --max-time 20 -w '\n%{http_code}' "$1" 2>/dev/null) && code=$(echo "$body" | tail -1) || code=000
              if [ "$code" = "200" ] && echo "$body" | grep -q "$2"; then echo "OK  $1"; return 0; fi
              echo "retry $i: $1 -> $code"; sleep 20
            done
            echo "DOWN $1 (last $code)"; return 1
          }
          fail=0
          check "https://www.maylinseoul.com/" "MAYLIN" || fail=1
          check "https://api.maylinseoul.com/api/health" "code" || fail=1
          exit $fail

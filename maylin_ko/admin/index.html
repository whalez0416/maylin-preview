<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>메이린 중문 사이트 · 예약 접수</title>
<link rel="icon" href="../assets/img/favicon.png" type="image/png">
<style>
:root{--bg:#f6f4f0;--paper:#fff;--ink:#141414;--ink2:#5a5652;--line:#e3ded6;--coral:#ff7048;--navy:#0b0f1a;--tint:#efe7de;
  --font:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;font:15px/1.55 var(--font);color:var(--ink);background:var(--bg)}
a{color:inherit}button{font:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
header{background:var(--navy);color:#fff}
header .wrap{display:flex;align-items:center;gap:14px;height:56px}
header b{font-size:1.02rem}header small{color:rgba(255,255,255,.6)}
header .sp{flex:1}
header button{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:999px;padding:6px 14px;cursor:pointer}
.login{max-width:380px;margin:80px auto;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:28px}
.login h1{margin:0 0 18px;font-size:1.3rem}.login p{margin:0 0 18px;color:var(--ink2);font-size:.92rem}
label{display:block;font-size:.82rem;color:var(--ink2);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
.btn{display:inline-block;padding:11px 20px;border-radius:999px;border:1px solid var(--ink);background:#fff;cursor:pointer;font-weight:600}
.btn.primary{background:var(--coral);border-color:var(--coral);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.err{margin:10px 0 0;color:#b83b2a;font-size:.9rem}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:22px 0 12px}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;cursor:pointer;color:var(--ink2)}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tabs button i{font-style:normal;margin-left:6px;opacity:.7}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.bar input{max-width:280px}.bar .muted{color:var(--ink2);font-size:.88rem}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
th,td{padding:12px 12px;text-align:left;border-top:1px solid var(--line);vertical-align:top;font-size:.92rem}
th{background:var(--tint);border-top:0;font-weight:600;color:var(--ink2);font-size:.8rem;white-space:nowrap}
tr[data-id]{cursor:pointer}tr[data-id]:hover{background:#fbf9f6}
td .c{font-weight:600}td .s{color:var(--ink2);font-size:.82rem}
.st{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.78rem;font-weight:600;white-space:nowrap}
.st-new{background:#ffe9e2;color:#c94a25}.st-contacted{background:#e8f0ff;color:#2b5bb5}.st-booked{background:#e3f6ea;color:#1e7a44}.st-closed{background:#eee;color:#666}
.empty{padding:40px;text-align:center;color:var(--ink2)}
.tw{overflow-x:auto}
/* 상세 패널 */
.ov{position:fixed;inset:0;background:rgba(11,15,26,.45);display:none;z-index:20}
.ov.on{display:block}
.panel{position:absolute;right:0;top:0;bottom:0;width:min(520px,100%);background:#fff;padding:24px;overflow:auto;box-shadow:-20px 0 60px rgba(0,0,0,.2)}
.panel h2{margin:0 0 4px;font-size:1.2rem}.panel .when{color:var(--ink2);font-size:.85rem;margin:0 0 18px}
.kv{display:grid;grid-template-columns:96px 1fr;gap:8px 12px;font-size:.95rem}
.kv b{color:var(--ink2);font-weight:500;font-size:.85rem}
.kv .copy{margin-left:8px;font-size:.78rem;border:1px solid var(--line);background:#fff;border-radius:6px;padding:2px 8px;cursor:pointer}
.panel .x{position:absolute;right:14px;top:10px;font-size:1.8rem;background:none;border:0;cursor:pointer;color:var(--ink2)}
.panel .act{margin-top:18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.saved{color:#1e7a44;font-size:.88rem}
@media (max-width:640px){th:nth-child(5),td:nth-child(5),th:nth-child(6),td:nth-child(6){display:none}.panel{padding:18px}}
</style>
</head>
<body>

<header><div class="wrap"><img src="../assets/img/logo-mark.svg" alt="" width="26" height="27" style="filter:brightness(1.35)"><b>媄琳 · 중문 사이트 예약 접수</b><small id="who"></small><span class="sp"></span><button id="refresh" hidden>새로고침</button><button id="logout" hidden>로그아웃</button></div></header>

<main class="wrap">
  <section class="login" id="login">
    <h1>관리자 로그인</h1>
    <form id="lf">
      <label>아이디<input type="text" name="email" autocomplete="username" autocapitalize="off" required></label>
      <label>비밀번호<input type="password" name="password" autocomplete="current-password" required></label>
      <p class="err" id="lerr" hidden></p>
      <div style="margin-top:16px"><button class="btn primary" type="submit">로그인</button></div>
    </form>
  </section>

  <section id="app" hidden>
    <div class="tabs" id="tabs">
      <button data-st="" class="on">전체<i></i></button>
      <button data-st="new">신규<i></i></button>
      <button data-st="contacted">연락함<i></i></button>
      <button data-st="booked">예약확정<i></i></button>
      <button data-st="closed">종료<i></i></button>
    </div>
    <div class="bar"><input type="search" id="q" placeholder="연락처·이름·메모 검색"><span class="muted" id="cnt"></span></div>
    <div class="tw"><table>
      <thead><tr><th>접수</th><th>상태</th><th>연락처 · 이름</th><th>희망일 · 항목</th><th>남긴 말</th><th>유입</th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
    <div class="empty" id="empty" hidden>접수가 없습니다.</div>
  </section>
</main>

<div class="ov" id="ov"><div class="panel" id="panel"></div></div>

<script>
(function(){
var API='https://api.maylinseoul.com', KEY='maylin_admin_auth';
var PROG={'全新概念提升':'뉴노멀 리프팅','均衡提升':'밸런스 리프팅','一日极致提升':'원데이 익스트림 리프팅','面部雕塑':'페이셜 스컬프팅','定制双重激光嫩肤':'커스텀 듀얼토닝','医疗护肤':'메디컬 스킨케어','还没想好，想先面诊':'미정 · 먼저 상담'};
var ST={new:'신규',contacted:'연락함',booked:'예약확정',closed:'종료'};
var auth=null, all=[], cur='', q='';
try{auth=JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){}
var $=function(s){return document.querySelector(s);};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function fmt(d){if(!d)return '';var t=new Date(d.replace(' ','T'));if(isNaN(t))return d;var p=function(n){return (n<10?'0':'')+n;};return t.getFullYear()+'-'+p(t.getMonth()+1)+'-'+p(t.getDate())+' '+p(t.getHours())+':'+p(t.getMinutes());}
function api(path,opt){opt=opt||{};opt.headers=Object.assign({'Content-Type':'application/json'},opt.headers||{});if(auth&&auth.token)opt.headers.Authorization=auth.token;
  return fetch(API+path,opt).then(function(r){if(r.status===401||r.status===403){if(path.indexOf('auth-with')<0){logout();}}return r.json().then(function(j){if(!r.ok)throw j;return j;});});}
function logout(){auth=null;try{localStorage.removeItem(KEY);}catch(e){}$('#app').hidden=true;$('#login').hidden=false;$('#logout').hidden=true;$('#refresh').hidden=true;$('#who').textContent='';}
function show(){$('#login').hidden=true;$('#app').hidden=false;$('#logout').hidden=false;$('#refresh').hidden=false;$('#who').textContent=' · '+((auth.record&&auth.record.email)||'').replace('@maylinseoul.com','');load();}

$('#lf').addEventListener('submit',function(e){e.preventDefault();var f=e.target;$('#lerr').hidden=true;
  api('/api/collections/users/auth-with-password',{method:'POST',body:JSON.stringify({identity:(function(v){return v.indexOf('@')<0?v+'@maylinseoul.com':v;})(f.email.value.trim()),password:f.password.value})})
  .then(function(j){auth={token:j.token,record:j.record};try{localStorage.setItem(KEY,JSON.stringify(auth));}catch(e){}f.reset();show();})
  .catch(function(){$('#lerr').textContent='아이디 또는 비밀번호가 맞지 않습니다.';$('#lerr').hidden=false;});});
$('#logout').addEventListener('click',logout);
$('#refresh').addEventListener('click',load);
$('#tabs').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;cur=b.dataset.st;[].forEach.call($('#tabs').children,function(x){x.classList.toggle('on',x===b);});render();});
$('#q').addEventListener('input',function(e){q=e.target.value.trim().toLowerCase();render();});

function load(){api('/api/collections/inquiries/records?sort=-created&perPage=500').then(function(j){all=j.items||[];render();}).catch(function(){});}
function render(){var c={'':all.length,new:0,contacted:0,booked:0,closed:0};all.forEach(function(r){var s=r.status||'new';c[s]=(c[s]||0)+1;});
  [].forEach.call($('#tabs').children,function(b){b.querySelector('i').textContent=c[b.dataset.st]||0;});
  var list=all.filter(function(r){var s=r.status||'new';if(cur&&s!==cur)return false;if(q){var h=[r.contact,r.name,r.note,r.memo,r.program].join(' ').toLowerCase();if(h.indexOf(q)<0)return false;}return true;});
  $('#cnt').textContent=list.length+'건';$('#empty').hidden=list.length>0;
  $('#rows').innerHTML=list.map(function(r){var s=r.status||'new';return '<tr data-id="'+r.id+'"><td>'+esc(fmt(r.created))+'</td><td><span class="st st-'+s+'">'+ST[s]+'</span></td>'+
    '<td><div class="c">'+esc(r.contact)+'</div><div class="s">'+esc(r.name||'')+'</div></td>'+
    '<td>'+esc(r.date||'—')+'<div class="s">'+esc(PROG[r.program]||r.program||'')+'</div></td>'+
    '<td>'+esc(r.note||'')+(r.memo?'<div class="s">메모: '+esc(r.memo)+'</div>':'')+'</td><td class="s">'+esc((r.page||'').replace('.html',''))+'</td></tr>';}).join('');}
$('#rows').addEventListener('click',function(e){var tr=e.target.closest('tr[data-id]');if(!tr)return;open(all.filter(function(r){return r.id===tr.dataset.id;})[0]);});

function open(r){if(!r)return;var s=r.status||'new';
  $('#panel').innerHTML='<button class="x" id="px" aria-label="닫기">×</button><h2>'+esc(r.contact)+'</h2><p class="when">'+esc(fmt(r.created))+' 접수 · '+esc((r.page||'').replace('.html',''))+' 페이지에서</p>'+
    '<div class="kv"><b>연락처</b><span>'+esc(r.contact)+'<button class="copy" data-c="'+esc(r.contact)+'">복사</button></span>'+
    '<b>이름/호칭</b><span>'+esc(r.name||'—')+'</span><b>희망 날짜</b><span>'+esc(r.date||'—')+'</span>'+
    '<b>관심 항목</b><span>'+esc(PROG[r.program]||r.program||'—')+(r.program&&PROG[r.program]?' <span class="s">('+esc(r.program)+')</span>':'')+'</span>'+
    '<b>남긴 말</b><span>'+esc(r.note||'—')+'</span><b>동의</b><span>'+(r.consent?'개인정보 처리 동의함':'—')+'</span></div>'+
    '<label>상태<select id="pst">'+Object.keys(ST).map(function(k){return '<option value="'+k+'"'+(k===s?' selected':'')+'>'+ST[k]+'</option>';}).join('')+'</select></label>'+
    '<label>담당자 메모<textarea id="pmemo" rows="4" maxlength="1000" placeholder="통화 내용, 예약 일시 등">'+esc(r.memo||'')+'</textarea></label>'+
    '<div class="act"><button class="btn primary" id="psave">저장</button><span class="saved" id="pok" hidden>저장했습니다</span></div>'+
    '<p class="s" style="margin-top:22px;color:var(--ink2)">위챗 ID면 위챗에서 검색해 친구 추가 후 연락하세요. 중국 휴대폰(+86)은 위챗 검색도 됩니다.</p>';
  $('#ov').classList.add('on');
  $('#px').onclick=close;
  $('#panel').querySelector('.copy').onclick=function(){var t=this.dataset.c;var done=function(){this.textContent='복사됨';}.bind(this);if(navigator.clipboard)navigator.clipboard.writeText(t).then(done);else{var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(e){}ta.remove();}};
  $('#psave').onclick=function(){var b=this;b.disabled=true;api('/api/collections/inquiries/records/'+r.id,{method:'PATCH',body:JSON.stringify({status:$('#pst').value,memo:$('#pmemo').value.trim()})})
    .then(function(j){Object.assign(r,j);$('#pok').hidden=false;setTimeout(function(){$('#pok').hidden=true;},1500);render();}).catch(function(){alert('저장에 실패했습니다. 다시 시도해 주세요.');}).then(function(){b.disabled=false;});};}
function close(){$('#ov').classList.remove('on');}
$('#ov').addEventListener('click',function(e){if(e.target===$('#ov'))close();});
document.addEventListener('keydown',function(e){if(e.key==='Escape')close();});

if(auth&&auth.token){api('/api/collections/users/auth-refresh',{method:'POST'}).then(function(j){auth={token:j.token,record:j.record};try{localStorage.setItem(KEY,JSON.stringify(auth));}catch(e){}show();}).catch(logout);}
setInterval(function(){if(auth&&!$('#app').hidden)load();},60000);
})();
</script>
</body>
</html>
